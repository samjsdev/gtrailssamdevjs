    <path d="M0 40H1400 M0 80H1400 M0 120H1400 M0 160H1400 M0 200H1400 M0 240H1400 M0 280H1400 M0 320H1400 M0 360H1400 M0 400H1400 M0 440H1400 M0 480H1400 M0 520H1400 M0 560H1400 M0 600H1400 M0 640H1400 M0 680H1400 M0 720H1400 M0 760H1400 M0 800H1400 M0 840H1400 M0 880H1400" />
  </g>

