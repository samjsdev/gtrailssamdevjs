<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none" stroke="currentColor">
  <defs>
    <!-- Architectural Hatching Pattern -->
    <pattern id="cad-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
