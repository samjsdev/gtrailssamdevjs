      <circle cx="4" cy="4" r="0.8" fill="currentColor" fill-opacity="0.25" />
      <circle cx="12" cy="12" r="0.8" fill="currentColor" fill-opacity="0.25" />
      <circle cx="12" cy="4" r="0.5" fill="currentColor" fill-opacity="0.15" />
      <circle cx="4" cy="12" r="0.5" fill="currentColor" fill-opacity="0.15" />
