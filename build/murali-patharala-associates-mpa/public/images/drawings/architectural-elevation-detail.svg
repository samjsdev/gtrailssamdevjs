<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" fill="none" stroke="currentColor">
  <defs>
    <!-- Louver & Facade Slats Pattern -->
    <pattern id="louver-pattern" width="6" height="12" patternUnits="userSpaceOnUse">
      <line x1="1" y1="0" x2="1" y2="12" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" />
    </pattern>
    <pattern id="brick-running" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="12" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="12" y1="0" x2="12" y2="6" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="0" y1="6" x2="24" y2="6" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- BACKGROUND CAD DRAFTING GRID -->
  <g stroke="currentColor" stroke-width="0.5" stroke-opacity="0.12">
    <path d="M50 0V750 M100 0V750 M150 0V750 M200 0V750 M250 0V750 M300 0V750 M350 0V750 M400 0V750 M450 0V750 M500 0V750 M550 0V750 M600 0V750 M650 0V750 M700 0V750 M750 0V750 M800 0V750 M850 0V750 M900 0V750 M950 0V750 M1000 0V750 M1050 0V750 M1100 0V750 M1150 0V750 M1200 0V750 M1250 0V750 M1300 0V750 M1350 0V750" />
    <path d="M0 50H1400 M0 100H1400 M0 150H1400 M0 200H1400 M0 250H1400 M0 300H1400 M0 350H1400 M0 400H1400 M0 450H1400 M0 500H1400 M0 550H1400 M0 600H1400 M0 650H1400 M0 700H1400" />
  </g>

  <!-- GROUND LEVEL & FOUNDATION FOOTING DETAIL -->
  <!-- Natural Ground Line (Thick Multi-Dash) -->
  <line x1="50" y1="580" x2="1350" y2="580" stroke="currentColor" stroke-width="3" stroke-opacity="0.9" />
  <line x1="50" y1="586" x2="1350" y2="586" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="8 4" stroke-opacity="0.8" />
  <g stroke="currentColor" stroke-width="0.8" stroke-opacity="0.3">
    <!-- Earth Hatching Angle Ticks -->
    <path d="M70 586L50 610 M120 586L100 610 M170 586L150 610 M220 586L200 610 M270 586L250 610 M320 586L300 610 M370 586L350 610 M420 586L400 610 M470 586L450 610 M520 586L500 610 M570 586L550 610 M620 586L600 610 M670 586L650 610 M720 586L700 610 M770 586L750 610 M820 586L800 610 M870 586L850 610 M920 586L900 610 M970 586L950 610 M1020 586L1000 610 M1070 586L1050 610 M1120 586L1100 610 M1170 586L1150 610 M1220 586L1200 610 M1270 586L1250 610 M1320 586L1300 610" />
  </g>

  <!-- ISOLATED REINFORCED FOOTINGS (Sub-structure below 580) -->
  <g stroke="#EA580C" stroke-width="1" stroke-opacity="0.5" fill="none">
    <rect x="230" y="620" width="80" height="30" />
    <line x1="270" y1="586" x2="270" y2="620" stroke-width="1.5" />
    <rect x="530" y="620" width="80" height="30" />
    <line x1="570" y1="586" x2="570" y2="620" stroke-width="1.5" />
    <rect x="830" y="620" width="80" height="30" />
    <line x1="870" y1="586" x2="870" y2="620" stroke-width="1.5" />
    <rect x="1090" y="620" width="80" height="30" />
    <line x1="1130" y1="586" x2="1130" y2="620" stroke-width="1.5" />
  </g>

  <!-- STRUCTURAL FRAME & ELEVATION MASSES -->
  <g stroke="currentColor" stroke-width="2.5" stroke-opacity="0.9" fill="none">
    <!-- Main Villa Elevation Profile -->
    <!-- Ground Floor Base -->
    <rect x="240" y="440" width="920" height="140" />

    <!-- First Floor Cantilever Volume -->
    <rect x="210" y="280" width="620" height="160" />

    <!-- Second Floor Setback Terrace & Penthouse -->
    <rect x="520" y="140" width="610" height="140" />

    <!-- Architectural Feature Tower / Stair Headroom -->
    <rect x="520" y="80" width="180" height="60" stroke="#EA580C" stroke-width="2" />
  </g>

  <!-- CANTILEVER PERGOLA & SHADING LOUVERS -->
  <g stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.8">
    <!-- Cantilever Overhang Beams Left -->
    <line x1="170" y1="280" x2="210" y2="280" stroke-width="3" />
    <line x1="170" y1="280" x2="170" y2="295" stroke-width="2" />
    <!-- Roof Pergola Rafters -->
    <path d="M720 125H1150 M740 125V140 M780 125V140 M820 125V140 M860 125V140 M900 125V140 M940 125V140 M980 125V140 M1020 125V140 M1060 125V140 M1100 125V140 M1140 125V140" />
  </g>

  <!-- ARCHITECTURAL WINDOW GLAZING & BALCONY GLASS RAILINGS -->
  <g stroke="currentColor" stroke-width="1.2" stroke-opacity="0.75" fill="none">
    <!-- Ground Floor Large Picture Windows -->
    <rect x="270" y="465" width="220" height="100" />
    <line x1="380" y1="465" x2="380" y2="565" stroke="#EA580C" />
    <!-- Window Glazing Reflection Lines -->
    <line x1="290" y1="480" x2="350" y2="550" stroke="currentColor" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.4" />
    <line x1="310" y1="480" x2="370" y2="550" stroke="currentColor" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.4" />

    <!-- Entrance Portal (Teak Wood Cladding Lines) -->
    <rect x="540" y="450" width="120" height="130" stroke="#EA580C" stroke-width="2" />
    <line x1="600" y1="450" x2="600" y2="580" stroke="#EA580C" stroke-width="1.5" />
    <path d="M550 450V580 M560 450V580 M570 450V580 M580 450V580 M590 450V580 M610 450V580 M620 450V580 M630 450V580 M640 450V580 M650 450V580" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.4" />

    <!-- Ground Floor Side Bedroom Glazing -->
    <rect x="710" y="465" width="420" height="100" />
    <line x1="850" y1="465" x2="850" y2="565" stroke="#EA580C" />
    <line x1="990" y1="465" x2="990" y2="565" stroke="#EA580C" />

    <!-- First Floor Master Suite Cantilever Window & Slat Screen -->
    <rect x="230" y="300" width="280" height="120" />
    <!-- Vertical Louvers Screen (Passive Climate Shading) -->
    <rect x="530" y="300" width="270" height="120" fill="url(#louver-pattern)" stroke="#EA580C" stroke-width="1.5" />

    <!-- Glass Railing Balcony with Standoff Pins -->
    <line x1="210" y1="420" x2="520" y2="420" stroke="#EA580C" stroke-width="2" />
    <line x1="210" y1="380" x2="520" y2="380" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="8 3" />
    <circle cx="240" cy="420" r="3" fill="#EA580C" />
    <circle cx="320" cy="420" r="3" fill="#EA580C" />
    <circle cx="400" cy="420" r="3" fill="#EA580C" />
    <circle cx="480" cy="420" r="3" fill="#EA580C" />

    <!-- Second Floor Terrace Pergola Glass Front -->
    <rect x="540" y="160" width="320" height="100" />
    <line x1="640" y1="160" x2="640" y2="260" stroke="#EA580C" />
    <line x1="740" y1="160" x2="740" y2="260" stroke="#EA580C" />
  </g>

  <!-- ARCHITECTURAL LEVEL DATUM MARKERS (Right Side) -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold">
    <!-- Level Lines Extending Right -->
    <!-- Headroom Level -->
    <line x1="700" y1="80" x2="1320" y2="80" stroke="#EA580C" stroke-width="1" stroke-dasharray="10 5 2 5" stroke-opacity="0.7" />
    <polygon points="1280,80 1310,70 1310,80" fill="#EA580C" />
    <text x="1320" y="84" fill="#EA580C">+14.20m PARAPET TOP</text>

    <!-- Roof / Terrace Level -->
    <line x1="1130" y1="140" x2="1320" y2="140" stroke="currentColor" stroke-width="0.9" stroke-dasharray="10 5 2 5" stroke-opacity="0.6" />
    <polygon points="1280,140 1310,130 1310,140" fill="#EA580C" />
    <text x="1320" y="144" fill="currentColor" fill-opacity="0.85">+11.20m TERRACE SLAB</text>

    <!-- First Floor Level -->
    <line x1="830" y1="280" x2="1320" y2="280" stroke="currentColor" stroke-width="0.9" stroke-dasharray="10 5 2 5" stroke-opacity="0.6" />
    <polygon points="1280,280 1310,270 1310,280" fill="#EA580C" />
    <text x="1320" y="284" fill="currentColor" fill-opacity="0.85">+6.80m FIRST FLOOR SLAB</text>

    <!-- Plinth Beam Level -->
    <line x1="1160" y1="440" x2="1320" y2="440" stroke="currentColor" stroke-width="0.9" stroke-dasharray="10 5 2 5" stroke-opacity="0.6" />
    <polygon points="1280,440 1310,430 1310,440" fill="#EA580C" />
    <text x="1320" y="444" fill="currentColor" fill-opacity="0.85">+3.40m PLINTH LEVEL</text>

    <!-- Finished Ground Level -->
    <line x1="1160" y1="580" x2="1320" y2="580" stroke="#EA580C" stroke-width="1.2" stroke-opacity="0.8" />
    <polygon points="1280,580 1310,570 1310,580" fill="#EA580C" />
    <text x="1320" y="584" fill="#EA580C">±0.00m FINISHED ROAD</text>

    <!-- Isolated Footing Base -->
    <line x1="1170" y1="650" x2="1320" y2="650" stroke="currentColor" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.4" />
    <polygon points="1280,650 1310,642 1310,650" fill="currentColor" fill-opacity="0.5" />
    <text x="1320" y="654" fill="currentColor" fill-opacity="0.5">-1.80m HARD STRATA</text>
  </g>

  <!-- DIMENSION CHAINS (Left Vertical & Bottom Horizontal) -->
  <g stroke="currentColor" stroke-width="0.9" stroke-opacity="0.75" fill="none">
    <!-- Left Vertical Dimension Line -->
    <line x1="140" y1="80" x2="140" y2="580" />
    <line x1="130" y1="80" x2="520" y2="80" />
    <line x1="130" y1="140" x2="520" y2="140" />
    <line x1="130" y1="280" x2="210" y2="280" />
    <line x1="130" y1="440" x2="240" y2="440" />
    <line x1="130" y1="580" x2="240" y2="580" />

    <!-- 45-Degree Slash Ticks -->
    <line x1="134" y1="86" x2="146" y2="74" stroke="#EA580C" stroke-width="2" />
    <line x1="134" y1="146" x2="146" y2="134" stroke="#EA580C" stroke-width="2" />
    <line x1="134" y1="286" x2="146" y2="274" stroke="#EA580C" stroke-width="2" />
    <line x1="134" y1="446" x2="146" y2="434" stroke="#EA580C" stroke-width="2" />
    <line x1="134" y1="586" x2="146" y2="574" stroke="#EA580C" stroke-width="2" />

    <!-- Bottom Horizontal Dimension String -->
    <line x1="210" y1="700" x2="1160" y2="700" />
    <line x1="210" y1="580" x2="210" y2="710" />
    <line x1="520" y1="580" x2="520" y2="710" />
    <line x1="830" y1="580" x2="830" y2="710" />
    <line x1="1160" y1="580" x2="1160" y2="710" />

    <line x1="204" y1="706" x2="216" y2="694" stroke="#EA580C" stroke-width="2" />
    <line x1="514" y1="706" x2="526" y2="694" stroke="#EA580C" stroke-width="2" />
    <line x1="824" y1="706" x2="836" y2="694" stroke="#EA580C" stroke-width="2" />
    <line x1="1154" y1="706" x2="1166" y2="694" stroke="#EA580C" stroke-width="2" />
  </g>

  <!-- DIMENSION TEXT NUMBERS -->
  <g fill="currentColor" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="600">
    <text x="110" y="115" text-anchor="middle" transform="rotate(-90 110 115)">3 000</text>
    <text x="110" y="210" text-anchor="middle" transform="rotate(-90 110 210)">4 400</text>
    <text x="110" y="360" text-anchor="middle" transform="rotate(-90 110 360)">3 400</text>
    <text x="110" y="510" text-anchor="middle" transform="rotate(-90 110 510)">3 400</text>

    <!-- Bottom Spans -->
    <text x="365" y="720" text-anchor="middle">6 200</text>
    <text x="675" y="720" text-anchor="middle">6 200</text>
    <text x="995" y="720" text-anchor="middle">6 600</text>
    <text x="685" y="740" text-anchor="middle" fill="#EA580C" font-weight="bold">19 000 OVERALL STRUCTURAL LENGTH</text>
  </g>

  <!-- ACCENT TECHNICAL ANNOTATION LABELS -->
  <g fill="currentColor" font-family="'Work Sans', sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5">
    <text x="220" y="260" fill="#EA580C">CANTILEVER BEDROOM SUITE</text>
    <text x="540" y="125" fill="#EA580C">ROOF TERRACE PERGOLA</text>
    <text x="800" y="435" fill="currentColor" fill-opacity="0.6">DOUBLE-HEIGHT FOYER PORTAL</text>
  </g>

  <!-- LINEAR GRAPHIC SCALE BAR -->
  <g transform="translate(240, 40)">
    <rect x="0" y="0" width="200" height="8" fill="none" stroke="#EA580C" stroke-width="1.2" />
    <rect x="0" y="0" width="50" height="8" fill="#EA580C" />
    <rect x="100" y="0" width="50" height="8" fill="#EA580C" />
    <text x="0" y="24" fill="currentColor" fill-opacity="0.7" font-family="'Courier New', monospace" font-size="9">0m</text>
    <text x="50" y="24" fill="currentColor" fill-opacity="0.7" font-family="'Courier New', monospace" font-size="9">1m</text>
    <text x="100" y="24" fill="currentColor" fill-opacity="0.7" font-family="'Courier New', monospace" font-size="9">2m</text>
    <text x="200" y="24" fill="currentColor" fill-opacity="0.7" font-family="'Courier New', monospace" font-size="9">4m</text>
    <text x="100" y="-8" fill="#EA580C" font-family="'Courier New', monospace" font-size="9" font-weight="bold" text-anchor="middle">GRAPHIC SCALE &bull; 1:100</text>
  </g>
</svg>
