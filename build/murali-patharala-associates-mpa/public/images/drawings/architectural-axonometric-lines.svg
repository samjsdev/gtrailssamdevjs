<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" stroke="currentColor">
  <!-- ISOMETRIC 30-DEGREE DRAFTING GRID -->
  <g stroke="currentColor" stroke-width="0.5" stroke-opacity="0.1">
    <path d="M0 100L1200 446 M0 200L1200 546 M0 300L1200 646 M0 400L1200 746 M0 0L1200 346" />
    <path d="M1200 100L0 446 M1200 200L0 546 M1200 300L0 646 M1200 400L0 746 M1200 0L0 346" />
    <path d="M200 0V700 M400 0V700 M600 0V700 M800 0V700 M1000 0V700" />
  </g>

  <!-- 3D AXONOMETRIC VILLA MASSING (Center) -->
  <g transform="translate(600, 360)" stroke="currentColor" stroke-width="2" stroke-opacity="0.85" fill="none">
    <!-- Ground Base Slab -->
    <polygon points="-300,60 0,233 300,60 0,-113" stroke="#EA580C" stroke-width="1.5" fill="currentColor" fill-opacity="0.03" />

    <!-- Lower Level Massing -->
    <polygon points="-260,30 -60,145 140,30 -60,-85" />
    <line x1="-260" y1="30" x2="-260" y2="-90" />
    <line x1="-60" y1="145" x2="-60" y2="25" />
    <line x1="140" y1="30" x2="140" y2="-90" />
    <polygon points="-260,-90 -60,25 140,-90 -60,-205" fill="currentColor" fill-opacity="0.05" />

    <!-- Upper Level Cantilever Massing (Projecting Out) -->
    <polygon points="-200,-90 60,60 280,-67 20,-217" stroke="#EA580C" stroke-width="2.5" />
    <line x1="-200" y1="-90" x2="-200" y2="-210" stroke="#EA580C" stroke-width="2" />
    <line x1="60" y1="60" x2="60" y2="-60" stroke="#EA580C" stroke-width="2.5" />
    <line x1="280" y1="-67" x2="280" y2="-187" stroke="#EA580C" stroke-width="2" />
    <polygon points="-200,-210 60,-60 280,-187 20,-337" stroke="#EA580C" stroke-width="2" fill="#EA580C" fill-opacity="0.08" />

    <!-- Cantilever Overhang Projection Dash Lines to Ground -->
    <line x1="60" y1="60" x2="60" y2="180" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="6 4" />
    <line x1="280" y1="-67" x2="280" y2="53" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="6 4" />

    <!-- Glazing Mullions on Upper Cantilever -->
    <line x1="-70" y1="-135" x2="-70" y2="-15" stroke="currentColor" stroke-width="1.2" />
    <line x1="-135" y1="-172" x2="-135" y2="-52" stroke="currentColor" stroke-width="1.2" />
    <line x1="170" y1="-3" x2="170" y2="-123" stroke="currentColor" stroke-width="1.2" />

    <!-- Double Height Central Cutout Void (Courtyard) -->
    <polygon points="-120,-45 -40,1 40,-45 -40,-91" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="-40" y1="1" x2="-40" y2="116" stroke="#EA580C" stroke-dasharray="4 3" />

    <!-- Solar Sun-Path Trajectory Arc -->
    <path d="M-360,-120 Q0,-420 360,-160" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />
    <circle cx="180" cy="-330" r="14" fill="#EA580C" fill-opacity="0.2" stroke="#EA580C" stroke-width="2" />
    <circle cx="180" cy="-330" r="6" fill="#EA580C" />
    <line x1="180" y1="-355" x2="180" y2="-345" stroke="#EA580C" stroke-width="1.5" />
    <line x1="180" y1="-315" x2="180" y2="-305" stroke="#EA580C" stroke-width="1.5" />
    <line x1="155" y1="-330" x2="165" y2="-330" stroke="#EA580C" stroke-width="1.5" />
    <line x1="195" y1="-330" x2="205" y2="-330" stroke="#EA580C" stroke-width="1.5" />
    <text x="180" y="-365" fill="#EA580C" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle" stroke="none">SUN-PATH AZIMUTH 78°</text>

    <!-- Natural Cross-Ventilation Airflow Arrows -->
    <path d="M-320,100 C-180,60 -80,100 0,60 C80,20 180,0 320,-80" stroke="#38BDF8" stroke-width="2" stroke-dasharray="10 5" fill="none" />
    <polygon points="320,-80 300,-88 305,-72" fill="#38BDF8" />
    <text x="-240" y="130" fill="#38BDF8" font-family="'Work Sans', sans-serif" font-size="9" font-weight="bold" stroke="none" letter-spacing="1">PREVAILING S.E. CHENNAI SEA BREEZE</text>
  </g>

  <!-- TECHNICAL METADATA CORNERS -->
  <g fill="currentColor" fill-opacity="0.7" font-family="'Courier New', monospace" font-size="10">
    <text x="40" y="50" fill="#EA580C" font-weight="bold">AXONOMETRIC SPATIAL GEOMETRY</text>
    <text x="40" y="70">PROJECTION: ISOMETRIC 30° / 30°</text>
    <text x="40" y="90">PASSIVE THERMAL &amp; MICROCLIMATE MODELLING</text>

    <text x="1160" y="50" text-anchor="end" fill="#EA580C" font-weight="bold">COORDINATES</text>
    <text x="1160" y="70" text-anchor="end">13.0827° N, 80.2707° E</text>
    <text x="1160" y="90" text-anchor="end">ANNA NAGAR, CHENNAI</text>
  </g>
</svg>
